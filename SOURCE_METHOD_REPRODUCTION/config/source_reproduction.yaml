experiment:
  name: source_method_reproduction
  horizon: 96
  interval_hours: 0.25
  n_datacenters: 3
  workloads: 10
  subtasks: 50
  train_scenarios: 600
  validation_scenarios: 100
  test_scenarios: 100
  train_seed_start: 1000
  validation_seed_start: 2000
  test_seed_start: 3000
environment:
  dc_capacity_kw: [1800.0, 1800.0, 1800.0]
  dc_base_kw: [240.0, 240.0, 240.0]
  bandwidth_capacity_mbps: [6500.0, 6500.0, 6500.0]
  carbon_price_per_kg: 0.10
  carbon_quota_kg: 13240.0
  remote_migration_slots: 1
ppo:
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0001
  discount_factor: 0.99
  clip_range: 0.2
  gae_lambda: 0.9
  minibatch_size: 128
  training_episodes: 3000
  hidden_size: 128
  attention_heads: 8
  gradient_clip: 0.5
  entropy_coefficient: 0.2
  value_coefficient: 0.5
  update_epochs: 4
  parallel_envs: 16
  rollout_steps: 64
  seed: 2026
